name: Main
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
          require-lockfile: true

      - name: Run typings script
        run: pnpm types

      - name: Run build script
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./packages
          retention-days: 7

  test:
    name: Test
    needs: build
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
          install: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./packages

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: coverage/clover.xml

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required to create the release
      pull-requests: write # Required to create the release PR
    needs:
      - test
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          runtime: node@latest
          cache: true
          install: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./packages

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm changeset publish
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""
